[project]
name = "antistrat"
version = "0.1.0"
description = "VALORANT Tactical Manager: data pipeline, round-read model and API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "zstandard>=0.23",
  "scipy>=1.13",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["antistrat*"]

[tool.setuptools.package-data]
"antistrat.quick" = ["data/*.json"]
